# .github/workflows/deploy-production.yml
name: Deploy Production

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18.x' }
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Install dependencies
        run: pnpm install
        
      - name: Build
        run: pnpm build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Prod Image
        run: |
          docker-compose \
            -f docker/prod/docker-compose.yml \
            -f docker/prod/docker-compose.postgres.yml \
            build
          docker tag saas_base_prod:latest ${DOCKERHUB_USER}/saas_base:latest
          docker push ${DOCKERHUB_USER}/saas_base:latest

      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /srv/saas_base
            docker-compose pull
            docker-compose up -d --remove-orphans

