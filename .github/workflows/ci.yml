# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install pnpm
	run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      - name: Run ESLint
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm test

      - name: Build Next.js
        run: pnpm build

